name: CI / Enterprise Quality & Governance Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Verify TypeScript, Tests, Governance & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alsaada_db
          POSTGRES_USER: alsaada_admin
          POSTGRES_PASSWORD: alsaada_secure_pass_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://alsaada_admin:alsaada_secure_pass_2026@127.0.0.1:5432/alsaada_db?schema=public
      DATABASE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BLIND_INDEX_SALT: abcdef0123456789abcdef0123456789
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=true

      - name: Generate Prisma Client
        run: pnpm --filter @alsaada/database db:generate

      - name: Push Database Schema
        run: pnpm --filter @alsaada/database db:push --accept-data-loss

      - name: Build Core Packages
        run: pnpm --filter "./packages/**" build

      - name: Compile TypeScript Across Monorepo
        run: pnpm typecheck

      - name: Run Automated Test Suites
        run: pnpm test

      - name: Install Security Scanners (Gitleaks & Semgrep)
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          sudo python3 -m pip install --break-system-packages semgrep || python3 -m pip install --break-system-packages semgrep || pipx install semgrep
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          semgrep --version

      - name: Verify Git Hygiene & Version Parity
        run: pnpm git-hygiene:verify

      - name: Run Full Enterprise Governance Gate
        run: pnpm governance:verify

      - name: Build Docker Container
        run: docker build -f docker/Dockerfile .
