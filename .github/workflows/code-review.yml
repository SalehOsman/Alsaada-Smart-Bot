name: AI Code Review / Alibaba Open Code Review (OCR)

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Alibaba AI Code Reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=true

      - name: Run Alibaba OCR Code Review Preview
        run: |
          echo "Executing Alibaba OCR Automated Review against AGENTS.md and Alibaba 6 pillars..."
          pnpm ocr:preview || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
