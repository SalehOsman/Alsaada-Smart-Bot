name: Release / Enterprise Monorepo Changesets Engine

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Changesets Automated Release & Tagging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Verify Git Hygiene & Version Parity
        run: pnpm git-hygiene:verify
        env:
          CI: 'true'

      - name: Create Release Pull Request or Tag Release
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release:tag
          pr-title: 'chore(release): version packages and automated release'
          commit-message: 'chore(release): version packages [skip ci]'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
