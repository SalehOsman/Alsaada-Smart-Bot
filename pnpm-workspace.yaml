blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustLockfile: true
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "prisma@7.10.0"
  - "@prisma/client@7.10.0"
  - "@prisma/engines@7.10.0"
  - "@prisma/adapter-pg@7.10.0"
minimumReleaseAgeExclude:
  - "@types/node@24.13.6"
  - "astro@7.3.3"
packages:
  - 'packages/*'
  - 'modules/*'
  - 'apps/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
overrides:
  postcss: ^8.5.28
  uuid: ^11.1.1
  lodash-es: ^4.18.1
  deepmerge-ts: ^8.0.2
  mysql2: ^3.24.4
  js-yaml: 4.1.0
supportedArchitectures:
  os:
    - win32
    - linux
  cpu:
    - x64

