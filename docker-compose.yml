name: alsaada-enterprise-system

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service (Isolated Internal Network)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: alsaada_enterprise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-alsaada_db}
      POSTGRES_USER: ${DB_USER:-alsaada_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alsaada_secure_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - alsaada-enterprise-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alsaada_admin} -d ${DB_NAME:-alsaada_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # 2. Redis Cache Service (Isolated Enterprise Cache)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alsaada_enterprise_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-alsaada_redis_secure_2026}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - alsaada-enterprise-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-alsaada_redis_secure_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 3. Alsaada Enterprise Bot Service (New System)
  # -------------------------------------------------------------
  bot:
    container_name: alsaada_enterprise_bot
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./attachments:/app/attachments
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-alsaada_admin}:${DB_PASSWORD:-alsaada_secure_pass_2026}@postgres:5432/${DB_NAME:-alsaada_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-alsaada_redis_secure_2026}@redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      SUPER_ADMIN_TELEGRAM_ID: ${SUPER_ADMIN_TELEGRAM_ID}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DASHBOARD_URL: ${DASHBOARD_URL}
      ADMIN_DASHBOARD_URL: ${ADMIN_DASHBOARD_URL}
      DASHBOARD_TUNNEL_URL: ${DASHBOARD_TUNNEL_URL}
      DASHBOARD_LOCAL_URL: ${DASHBOARD_LOCAL_URL:-http://localtest.me:3002}
      TZ: ${TZ:-Africa/Cairo}
    networks:
      - alsaada-enterprise-internal
      - alsaada-enterprise-public

  # -------------------------------------------------------------
  # 4. Prisma Studio Web UI (Visual Database Management)
  # -------------------------------------------------------------
  studio:
    container_name: alsaada_enterprise_studio
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Prisma 7.10 removed the --hostname CLI option; Docker publishes the port and
    # Prisma Studio binds correctly without that flag.
    command: ["pnpm", "--filter", "@alsaada/database", "exec", "prisma", "studio", "--port", "5556", "--browser", "none"]

    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-alsaada_admin}:${DB_PASSWORD:-alsaada_secure_pass_2026}@postgres:5432/${DB_NAME:-alsaada_db}?schema=public
    networks:
      - alsaada-enterprise-internal

  # Prisma ORM 7 Studio binds to loopback inside its container. Share the
  # namespace and forward the published port to the internal Studio port.
  studio-proxy:
    image: alpine/socat:latest
    container_name: alsaada_enterprise_studio_proxy
    restart: unless-stopped
    network_mode: "service:studio"
    depends_on:
      studio:
        condition: service_started
    command: ["TCP-LISTEN:5555,fork,reuseaddr,bind=0.0.0.0", "TCP:127.0.0.1:5556"]

  # -------------------------------------------------------------
  # 5. Alsaada Enterprise Admin Dashboard Web UI
  # -------------------------------------------------------------
  dashboard:
    container_name: alsaada_enterprise_dashboard
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3002
      DATABASE_URL: postgresql://${DB_USER:-alsaada_admin}:${DB_PASSWORD:-alsaada_secure_pass_2026}@postgres:5432/${DB_NAME:-alsaada_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-alsaada_redis_secure_2026}@redis:6379
      DASHBOARD_URL: ${DASHBOARD_URL}
      ADMIN_DASHBOARD_URL: ${ADMIN_DASHBOARD_URL}
      DASHBOARD_TUNNEL_URL: ${DASHBOARD_TUNNEL_URL}
      DASHBOARD_LOCAL_URL: ${DASHBOARD_LOCAL_URL:-http://localtest.me:3002}
      PRISMA_STUDIO_URL: ${PRISMA_STUDIO_URL:-http://studio:5555}
      PRISMA_STUDIO_TUNNEL_URL: ${PRISMA_STUDIO_TUNNEL_URL:-}
      DOCS_URL: ${DOCS_URL:-http://docs:80}
      DOCS_TUNNEL_URL: ${DOCS_TUNNEL_URL:-}
      TZ: ${TZ:-Africa/Cairo}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - alsaada-enterprise-internal
      - alsaada-enterprise-public

  # -------------------------------------------------------------
  # 6. Alsaada Enterprise Documentation & Living Architecture Portal
  # -------------------------------------------------------------
  docs:
    container_name: alsaada_enterprise_docs
    build:
      context: .
      dockerfile: docker/Dockerfile.docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCS_PORT:-4321}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - alsaada-enterprise-internal
      - alsaada-enterprise-public

  # -------------------------------------------------------------
  # 7. Automated PostgreSQL Backup Service (Prodrigestivill)
  # -------------------------------------------------------------
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: alsaada_enterprise_postgres_backup
    restart: unless-stopped
    volumes:
      - ./backups/database:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-alsaada_db}
      POSTGRES_USER: ${DB_USER:-alsaada_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alsaada_secure_pass_2026}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 80
      POSTGRES_EXTRA_OPTS: "--single-transaction --no-owner --no-privileges --clean --if-exists -F c"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alsaada-enterprise-internal

volumes:
  postgres_data:
    name: alsaada_enterprise_postgres_data
  redis_data:
    name: alsaada_enterprise_redis_data

networks:
  # Internal network for database and bot service communication
  alsaada-enterprise-internal:
    name: alsaada_enterprise_internal_network
  # Public/Outbound network: For Telegram Bot API calls
  alsaada-enterprise-public:
    name: alsaada_enterprise_public_network
