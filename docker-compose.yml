name: alsaada-enterprise-system

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service (Isolated Internal Network)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: alsaada_enterprise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-alsaada_db}
      POSTGRES_USER: ${DB_USER:-alsaada_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alsaada_secure_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - alsaada-enterprise-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alsaada_admin} -d ${DB_NAME:-alsaada_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # 2. Redis Cache Service (Isolated Enterprise Cache)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alsaada_enterprise_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-alsaada_redis_secure_2026}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - alsaada-enterprise-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-alsaada_redis_secure_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 3. Alsaada Enterprise Bot Service (New System)
  # -------------------------------------------------------------
  bot:
    container_name: alsaada_enterprise_bot
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./attachments:/app/attachments
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-alsaada_admin}:${DB_PASSWORD:-alsaada_secure_pass_2026}@postgres:5432/${DB_NAME:-alsaada_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-alsaada_redis_secure_2026}@redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      SUPER_ADMIN_TELEGRAM_ID: ${SUPER_ADMIN_TELEGRAM_ID}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - alsaada-enterprise-internal
      - alsaada-enterprise-public

  # -------------------------------------------------------------
  # 4. Prisma Studio Web UI (Visual Database Management)
  # -------------------------------------------------------------
  studio:
    container_name: alsaada_enterprise_studio
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["pnpm", "--filter", "@alsaada/database", "run", "db:studio"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-alsaada_admin}:${DB_PASSWORD:-alsaada_secure_pass_2026}@postgres:5432/${DB_NAME}?schema=public
    networks:
      - alsaada-enterprise-internal

  # -------------------------------------------------------------
  # 5. Alsaada Enterprise Admin Dashboard Web UI
  # -------------------------------------------------------------
  dashboard:
    container_name: alsaada_enterprise_dashboard
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3002
      DATABASE_URL: postgresql://${DB_USER:-alsaada_admin}:${DB_PASSWORD:-alsaada_secure_pass_2026}@postgres:5432/${DB_NAME:-alsaada_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-alsaada_redis_secure_2026}@redis:6379
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - alsaada-enterprise-internal
      - alsaada-enterprise-public

volumes:
  postgres_data:
    name: alsaada_enterprise_postgres_data
  redis_data:
    name: alsaada_enterprise_redis_data

networks:
  # Internal network for database and bot service communication
  alsaada-enterprise-internal:
    name: alsaada_enterprise_internal_network
  # Public/Outbound network: For Telegram Bot API calls
  alsaada-enterprise-public:
    name: alsaada_enterprise_public_network
