server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Explicit MIME types for WebAssembly (Pagefind search engine) and modern web assets
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/javascript js mjs;
        text/css css;
        application/json json;
        image/svg+xml svg;
    }

    # Gzip Compression for Instant Search & Fast Page Loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Security & Forensic Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache immutable static build assets (Astro & Pagefind chunks)
    location ~* \.(?:css|js|mjs|wasm|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static HTML and Routing for Astro Starlight
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Lightweight Healthcheck endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
